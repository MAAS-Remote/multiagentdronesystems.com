<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MADS Inc — Multi-Agent Drone Systems | Ottawa, Canada</title>
    <meta
      name="description"
      content="Multi-Agent Drone Systems (MADS) builds autonomous multi-drone platforms for surveillance, mapping, and delivery. Explore our fleet and technology from Ottawa, Canada."
    />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Decodes the path encoded by 404.html back into a real browser URL.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- ✅ Correct relative path for GitHub Pages -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
